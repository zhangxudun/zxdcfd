name: pytest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system libraries for gmsh
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libgl1 libxcursor1 libxft2 libxinerama1 libxrender1 libfontconfig1

      - name: Install Python packages
        run: python -m pip install gmsh pytest

      - name: Run pytest
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -v --tb=short -p no:cacheprovider 2>&1 | tee pytest-report.txt

      # 用默认参数把清单里的结构各跑一遍，打印每一步的实际结果（面、体、标注.json）
      - name: Run end-to-end example
        id: example
        continue-on-error: true
        env:
          PYTHONUTF8: '1'
        run: |
          set -o pipefail
          python tests/e2e_example.py e2e-example 2>&1 | tee e2e-example.txt

      # 把 pytest 输出和端到端示例输出发布出去，每次覆盖，不影响 main。
      # push 和手动触发发布到 ci-report 分支；本仓库分支发起的 PR 发布到 ci-report-pr 分支。
      - name: Publish report to ci-report branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_BRANCH: ${{ github.event_name == 'pull_request' && 'ci-report-pr' || 'ci-report' }}
        run: |
          mkdir report
          cd report
          {
            echo commit: $GITHUB_SHA
            echo run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
            echo gmsh: $(python -c 'import gmsh; print(gmsh.__version__)' 2>&1 | tail -n 1)
            echo
            cat ../pytest-report.txt
          } > pytest-report.txt
          {
            echo commit: $GITHUB_SHA
            echo run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
            echo
            cat ../e2e-example.txt
          } > e2e-example.txt
          git init -q -b "$REPORT_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pytest-report.txt e2e-example.txt
          git commit -q -m 'pytest report'
          git push -q -f https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git "$REPORT_BRANCH"

      - name: Fail if pytest or the example failed
        if: steps.pytest.outcome == 'failure' || steps.example.outcome == 'failure'
        run: exit 1
