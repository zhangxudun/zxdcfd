name: pytest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system libraries for gmsh
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libgl1 libxcursor1 libxft2 libxinerama1 libxrender1 libfontconfig1

      - name: Install Python packages
        run: python -m pip install gmsh pytest 'streamlit>=1.50' plotly pandas

      - name: Run pytest
        id: pytest
        continue-on-error: true
        env:
          # tests/test_end_to_end.py 把第 1–8 步的实际结果写到这里，每种结构只算一次
          E2E_REPORT: e2e-report.txt
          # tests/test_auto_run.py 的 AR-10 把 S3 自动运行（含网格无关性检查）的报告写到这里
          AUTO_RUN_REPORT: auto-run-report.txt
        run: |
          set -o pipefail
          python -m pytest -v --tb=short -p no:cacheprovider 2>&1 | tee pytest-report.txt

      # 把 pytest 输出和端到端报告发布出去，每次覆盖，不影响 main。
      # push 和手动触发发布到 ci-report 分支；本仓库分支发起的 PR 发布到 ci-report-pr 分支。
      - name: Publish report to ci-report branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_BRANCH: ${{ github.event_name == 'pull_request' && 'ci-report-pr' || 'ci-report' }}
        run: |
          mkdir report
          cd report
          {
            echo commit: $GITHUB_SHA
            echo run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
            echo gmsh: $(python -c 'import gmsh; print(gmsh.__version__)' 2>&1 | tail -n 1)
            echo
            cat ../pytest-report.txt
          } > pytest-report.txt
          {
            echo commit: $GITHUB_SHA
            echo run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
            echo
            cat ../e2e-report.txt 2>/dev/null || echo '没有生成端到端报告（tests/test_end_to_end.py 没有跑到 E2E-04）'
          } > e2e-report.txt
          {
            echo commit: $GITHUB_SHA
            echo run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
            echo
            cat ../auto-run-report.txt 2>/dev/null || echo '没有生成自动运行报告（tests/test_auto_run.py 没有跑到 AR-10）'
          } > auto-run-report.txt
          git init -q -b "$REPORT_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pytest-report.txt e2e-report.txt auto-run-report.txt
          git commit -q -m 'pytest report'
          git push -q -f https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git "$REPORT_BRANCH"

      - name: Fail if pytest failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1

  # 多人网页版的镜像: 能构建，网页能起来，并在镜像里用自带的 OpenFOAM 经队列真算一次 S1。
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t zxdcfd:latest .

      - name: Smoke test (queue + worker + OpenFOAM in image)
        run: docker run --rm zxdcfd:latest timeout 1500 python tests/smoke_docker.py

      - name: Web page starts
        run: |
          docker run -d --name web -p 8501:8501 -e ZXDCFD_USERS='测试:码' zxdcfd:latest
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8501/_stcore/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:8501/_stcore/health
          sleep 5
          docker logs web
          docker exec web ls /data
          docker rm -f web
